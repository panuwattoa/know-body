# Local Postgres for KnowBody dev.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: knowbody
      POSTGRES_PASSWORD: knowbody
      POSTGRES_DB: knowbody
    ports:
      - "5432:5432"
    volumes:
      - knowbody_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowbody"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  knowbody_pg:
