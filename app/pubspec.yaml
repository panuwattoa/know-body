name: knowbody
description: KnowBody — calm, gamified calorie & fitness tracking (Thai-first).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.7.0
  google_fonts: ^6.2.1 # Outfit
  image_picker: ^1.1.2 # snap a meal
  home_widget: ^0.6.0 # bridge to native iOS WidgetKit / Android widgets
  share_plus: ^10.1.2 # share progression cards
  path_provider: ^2.1.4 # temp file for share image
  supabase_flutter: ^2.8.0 # auth (email/Apple/Google) — optional, config-gated

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
